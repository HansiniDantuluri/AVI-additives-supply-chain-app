{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <form method="post" action="{{ form_action }}">
        <label for="batch_name">Batch Name</label>
        <input type="text" id="batch_name" name="batch_name" value="{{ batch.batch_name or '' }}" required>

        <label for="product_type">Product Type</label>
        <input type="text" id="product_type" name="product_type" value="{{ batch.product_type or '' }}">

        <label for="production_date">Production Date</label>
        <input type="date" id="production_date" name="production_date" value="{{ batch.production_date or '' }}" required>

        <button type="submit">Save Batch</button>
    </form>
    <p><a href="/batches">Back to batch list</a></p>
{% endblock %}
