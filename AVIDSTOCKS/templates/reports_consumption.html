{% extends "base.html" %}

{% block title %}Consumption Report{% endblock %}

{% block content %}
    <h1>Consumption Report</h1>
    <nav style="margin-bottom: 20px;">
    <a href="/reports/stock-levels">Stock Levels</a> | 
    <a href="/reports/consumption">Consumption</a> | 
    <a href="/reports/usage-trends">Usage Trends</a>
</nav>
    <form method="get" action="/reports/consumption">
        <label for="start_date">Start Date</label>
        <input type="date" id="start_date" name="start_date" value="{{ start_date }}">
        <label for="end_date">End Date</label>
        <input type="date" id="end_date" name="end_date" value="{{ end_date }}">
        <button type="submit">Refresh</button>
    </form>
    {% if message %}
        <p>{{ message }}</p>
    {% else %}
        <img src="/static/charts/consumption.png" alt="Consumption chart">
    {% endif %}
    <p><a href="/dashboard">Back to dashboard</a></p>
{% endblock %}
